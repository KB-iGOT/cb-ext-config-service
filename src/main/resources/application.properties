spring data jpa for postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/sunbird
spring.datasource.username=postgres
spring.datasource.password=password123
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000


#-----------Cassandra Configuration-----------------
spring.cassandra.startupTimeoutInSeconds=100000
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.keyspace-name=sunbird
spring.cassandra.username=sunbird
spring.cassandra.password=""
spring.cassandra.local-datacenter=DC1
cassandra.config.host=localhost
# Property needed by common-util's cassandra implementation (if not excluded)
sunbird_cassandra_consistency_level=ONE


#-----------------Authentication configuration-----------
accesstoken.publickey.basepath=/home/ramyar/Documents/publickey
sso.url=https://portal.dev.karmayogibharat.net/auth/
sso.realm=sunbird

#-----------------Org/User read services (for form-config rule matching)-----------------
org.read.endpoint=https://portal.qa.karmayogibharat.net/api/org/v1/read
user.read.endpoint=https://portal.qa.karmayogibharat.net/apis/proxies/v8/api/user/v2/read
lms.service.host=http://learner-service:9000/

#-----------------Form config rule priorities (higher = tried first)-----------------
form.config.rule.scores.designationMinistry=200
form.config.rule.scores.roleRootOrg=100
form.config.rule.scores.noCriteria=1

# SQL / bind-parameter tracing is extremely expensive under load - keep it off outside local debugging.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.orm.jpa.JpaTransactionManager=WARN
logging.level.org.springframework.transaction=WARN

#-----------------Redis configuration (host/port come from IGOT_REDIS_HOST / IGOT_REDIS_PORT, read directly in RedisConfig.java via a plain JedisPool)-----------
redis.timeout=2000

# Default TTL (in SECONDS - passed straight to Jedis SETEX) for form-config cache entries written via
# CacheService#putCache(key, object). Entries with their own volatility use an explicit TTL overload instead.
formconfig.redisCache.ttlSeconds=60000

#-----------------In-JVM L1 cache in front of the Redis rule-engine cache-----------------
# TTL is a self-healing backstop; writes invalidate immediately via Redis pub/sub.
formconfig.localCache.maxSize=2000
formconfig.localCache.ttlSeconds=300

# User designations are resolved per read request; cached briefly to keep the
# user-read service off the hot path without serving badly stale profile data.
user.designations.cacheTtlSeconds=300
spring.data.redis.host=${IGOT_REDIS_HOST:localhost}
spring.data.redis.port=${IGOT_REDIS_PORT:6379}
redis.timeout=84600