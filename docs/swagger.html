<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cb-ext-config-service — Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; }
    .topbar { display: none; }
    .back { padding: 8px 20px; font: 14px sans-serif; background: #f5f5f5; }
  </style>
</head>
<body>
  <div class="back"><a href="./">&larr; Back to docs</a></div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        // "Try it out" targets the servers[] in openapi.json (localhost:7010),
        // so it only works when the service is running on your machine.
        tryItOutEnabled: false
      });
    };
  </script>
</body>
</html>
